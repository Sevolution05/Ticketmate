<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticketmate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#F7CAC9;--rose-t:#FDF0EF;--ser:#92A8D1;--ser-d:#5B73A8;--ser-k:#34456F;--acc:#BF4F4C;--bg:#FBF6F6;--bd:#E7DCE0;--tx:#2A3350;--body:#5E6580;--mut:#8A8FA6;--w:#fff;--font:'Montserrat',sans-serif;color-scheme:light;box-sizing:border-box}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--body);font:500 15px/1.6 var(--font);min-height:100vh;display:flex;flex-direction:column}
a,button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ser-d);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--w);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em;color:var(--ser-k)}
.logo i{font-style:normal;color:var(--acc)}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap;transition:.2s}
nav a:hover{color:var(--ser-k);background:var(--rose-t)}
nav a.on{background:var(--ser-d);color:var(--w)}
.right{display:flex;gap:12px;align-items:center}
.lang{display:flex;border:1.5px solid var(--bd);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer;color:var(--body)}
.lang button[aria-pressed=true]{background:var(--rose);color:var(--ser-k)}
@media(max-width:760px){nav{order:3;width:100%}}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:32px 24px 72px}
.page{display:none}.page.on{display:block}
h1{font-size:clamp(28px,4vw,42px);line-height:1.15;font-weight:700;letter-spacing:-.022em;margin:0;color:var(--w)}
h2{font-size:clamp(22px,3vw,32px);line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;color:var(--tx)}
h3{color:var(--tx);font-weight:700}
.sub{margin:0 0 28px;max-width:62ch}
.btn{border:0;cursor:pointer;border-radius:8px;padding:10px 20px;font-weight:600;font-size:14px;background:var(--ser-d);color:var(--w);transition:.2s}
.btn:hover{background:var(--ser-k)}
.btn.ghost{background:transparent;border:1.5px solid var(--ser);color:var(--ser-d)}
.btn.ghost:hover{background:var(--rose-t)}
.btn.ghost.on{background:var(--rose-t);border-color:var(--ser-d);color:var(--ser-k)}
.btn.rose{background:var(--rose);color:var(--ser-k)}.btn.rose:hover{background:var(--rose-t)}
.btn.acc{background:var(--acc)}.btn.acc:hover{filter:brightness(.92);background:var(--acc)}
.btn.light{background:transparent;border:1.5px solid rgba(255,255,255,.7)}
.hero{background:linear-gradient(135deg,var(--ser-k),var(--ser-d));color:var(--w);border-radius:12px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;margin-bottom:40px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.search{display:flex;gap:8px;background:var(--w);border-radius:8px;padding:6px 6px 6px 16px;max-width:520px;margin-top:22px;border:2px solid transparent}
.search:focus-within{border-color:var(--rose)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx)}
.spot{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:22px}
.spot-k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rose)}
.spot-name{font-size:18px;font-weight:700;line-height:1.3;margin:8px 0 2px}
.spot-m{font-size:13px;opacity:.85;margin:0}
.nums{display:flex;gap:24px;margin:20px 0}
.nums div{display:flex;flex-direction:column}
.nums b{font-size:clamp(40px,6vw,56px);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--rose);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:var(--w);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.go{cursor:pointer;transition:.2s}.card.go:hover{box-shadow:0 8px 24px rgba(91,115,168,.2);transform:translateY(-2px)}
.cover{height:180px;position:relative;display:flex;align-items:flex-end;padding:16px;color:var(--w)}
.c1{background:linear-gradient(135deg,#34456F,#92A8D1)}.c2{background:linear-gradient(135deg,#92A8D1,#F7CAC9)}.c3{background:linear-gradient(135deg,#BF4F4C,#F7CAC9)}.c4{background:linear-gradient(135deg,#2A3350,#5B73A8)}.c5{background:linear-gradient(135deg,#F7CAC9,#92A8D1)}

.nm{font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.st{position:absolute;top:12px;left:12px;z-index:2;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.03em;background:var(--w);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.st.soon{color:var(--ser-k);background:var(--rose)}.st.few{color:#8a4a00;background:#FFE7BF}.st.sold{color:var(--w);background:var(--acc)}
.body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{margin:0;font-size:17px;line-height:1.3}
.meta{color:var(--mut);font-size:13px;margin:0}.meta.d{color:var(--tx);font-weight:600}
.cd{display:inline-flex;gap:6px;align-items:center;background:var(--rose-t);color:var(--ser-k);border-radius:8px;padding:8px 12px;font-size:13px;width:fit-content}
.cd.few{background:#FFF3DC;color:#8a4a00}.cd.sold{background:#FBE3E2;color:#9b3a38;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.actions .btn{flex:1;font-size:13px;padding:10px 12px}
.empty{color:var(--mut);border:1.5px dashed var(--bd);border-radius:10px;padding:32px;text-align:center;background:var(--w)}
form,.panel{background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:24px;max-width:560px}
#authf,#pform{background:none;border:0;padding:0;max-width:none}
label.f{display:block;font-weight:600;font-size:13px;margin:0 0 6px;color:var(--tx)}
.fld{margin-bottom:20px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],select{width:100%;background:var(--w);color:var(--tx);border:1.5px solid var(--bd);border-radius:8px;padding:11px 14px;outline:0}
input:focus,select:focus{border-color:var(--ser-d);box-shadow:0 0 0 3px rgba(91,115,168,.2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:block;padding:8px 14px;border:1.5px solid var(--bd);border-radius:8px;font-size:13px}
.chip input:checked+span{background:var(--rose-t);border-color:var(--ser-d);color:var(--ser-k);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--ser-d);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:center;margin-bottom:10px;cursor:pointer;color:var(--tx)}
.chk input{width:18px;height:18px;accent-color:var(--ser-d)}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:8px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;border-radius:6px;padding:8px;cursor:pointer;font-weight:600;color:var(--body)}
.tabs button.on{background:var(--ser-d);color:var(--w)}
.err{background:var(--rose-t);border:1.5px solid var(--rose);border-top:3px solid var(--acc);border-radius:8px;padding:10px 14px;color:var(--tx);font-size:13px;margin:0 0 16px}
.tablewrap{overflow-x:auto;margin-bottom:28px;background:var(--w);border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--bd)}
tbody tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:700;font-size:12px;background:var(--bg)}td{color:var(--tx)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--rose);color:var(--ser-k)}
.tag.v{background:var(--bg);border:1px solid var(--bd);color:var(--tx)}.tag.ver{background:#E4EBF7}.tag.sold{background:#FBE3E2;color:#9b3a38}.tag.few{background:#FFE7BF;color:#8a4a00}
.okmsg{margin-top:16px;padding:12px 16px;border-radius:8px;background:#E4EBF7;color:var(--ser-k);border:1px solid var(--ser);font-weight:600;font-size:14px}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;align-items:center}.bar select{width:auto;min-width:170px;max-width:100%}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price s{color:var(--mut);font-size:13px}.price b{font-size:22px;color:var(--ser-k)}
.rowtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(42,51,80,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.on{display:flex}
.box{background:var(--w);border-radius:12px;padding:28px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(42,51,80,.3);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.box h3{margin:0 0 10px;font-size:20px;line-height:1.3}.box p{margin:0 0 18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--w);padding:12px 20px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--rose);color:var(--ser-k)}
.un{font-weight:600;color:var(--tx);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user{display:flex;gap:10px;align-items:center}
footer{background:var(--ser-k);color:var(--w);padding:20px 24px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}

input[type=search]{width:100%;background:var(--w);color:var(--tx);border:1.5px solid var(--bd);border-radius:8px;padding:11px 14px;outline:0}
input[type=search]:focus{border-color:var(--ser-d);box-shadow:0 0 0 3px rgba(91,115,168,.2)}
.bar input[type=search]{width:auto;min-width:240px;flex:1;max-width:340px}
.pw{position:relative}.pw input{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;padding:6px;color:var(--mut);display:grid;place-items:center;border-radius:6px}
.eye:hover{color:var(--ser-k)}
.link{background:none;border:0;padding:0;color:var(--ser-d);font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:16px 0}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--bd)}
.gbtn{width:100%;display:flex;gap:10px;align-items:center;justify-content:center}
.avimg{object-fit:cover}.avl{width:96px;height:96px;font-size:34px}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.sec{margin-top:32px}.sec h3{margin:0 0 12px;font-size:18px}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--w);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin-bottom:8px;color:var(--tx)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--mut);margin:6px 0 0}
a.btn{display:inline-block;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Ticket<i>mate</i></div>
  <nav id="nav">
    <a href="#home" data-p="home">Home</a>
    <a href="#wishlist" data-p="wishlist">My Wishlist</a>
    <a href="#alert" data-p="alert">Ticket Alert</a>
    <a href="#resale" data-p="resale">Resale Board</a>
    <a href="#sell" data-p="sell">Sell Ticket</a>
  </nav>
  <div class="right">
    <div class="lang" role="group" aria-label="Language"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
    <div id="auth"></div>
  </div>
</header>
<main>
<section class="page" id="home">
  <div class="hero">
    <div>
      <h1 data-i="h1"></h1>
      <div class="search"><input id="q" type="text" data-ph="ph" aria-label="Search"><button class="btn rose" id="qbtn" data-i="search"></button></div>
    </div>
    <div class="spot" id="spot"></div>
  </div>
  <h2 data-i="feat"></h2>
  <p class="sub" data-i="featSub"></p>
  <div class="grid" id="cards"></div>
  <div class="empty" id="noresult" hidden data-i="noRes"></div>
</section>

<section class="page" id="wishlist">
  <h2 data-i="wT"></h2><p class="sub" data-i="wS"></p>
  <form id="wform">
    <div class="fld"><label class="f" for="wev" data-i="wEv"></label><select id="wev"></select></div>
    <div class="fld"><label class="f" data-i="wTier"></label><div class="chips" id="wtiers"></div></div>
    <div class="fld"><label class="f" for="wqty" data-i="wQty"></label><input id="wqty" type="number" min="1" max="6" value="2"></div>
    <div class="fld"><label class="f" for="wbud" data-i="wBud"></label><input id="wbud" type="number" min="0" step="100000" value="2500000"></div>
    <button class="btn" type="submit" data-i="wSave"></button>
  </form>
</section>

<section class="page" id="alert">
  <h2 data-i="aT"></h2><p class="sub" data-i="aS"></p>
  <div class="tablewrap"><table>
    <thead><tr><th data-i="thT"></th><th data-i="thC"></th><th data-i="thS"></th></tr></thead>
    <tbody id="sched"></tbody>
  </table></div>
  <form id="aform">
    <div class="fld"><label class="f" for="mail">Email</label><input id="mail" type="email" required placeholder="nhap_email_cua_ban@gmail.com"></div>
    <label class="chk"><input type="checkbox" checked><span data-i="chk1"></span></label>
    <label class="chk"><input type="checkbox"><span data-i="chk2"></span></label>
    <button class="btn" type="submit" style="margin-top:8px" data-i="aBtn"></button>
    <div class="okmsg" id="aok" hidden data-i="aOk"></div>
  </form>
</section>

<section class="page" id="resale">
  <h2 data-i="rT"></h2><p class="sub" data-i="rS"></p>
  <div class="bar">
    <button class="btn ghost" id="fwish" aria-pressed="false" data-i="fWish"></button>
    <input id="fcon" type="search" list="conlist" data-ph="fCon" aria-label="Concert" autocomplete="off"><datalist id="conlist"></datalist>
    <select id="ftier" aria-label="Tier"><option value="" data-i="fTier"></option></select>
    <a class="btn acc" href="#sell" data-i="postBtn" style="text-decoration:none;margin-left:auto"></a>
  </div>
  <div class="grid" id="listings"></div>
  <div class="empty" id="lempty" hidden data-i="lEmpty"></div>
</section>
<section class="page" id="sell">
  <h2 data-i="sT"></h2><p class="sub" data-i="sS"></p>
  <form id="sform">
    <div class="fld"><label class="f" for="sev" data-i="sEv"></label><select id="sev"></select></div>
    <div class="fld"><label class="f" for="stier" data-i="wTier"></label><select id="stier"></select></div>
    <div class="row2">
      <div class="fld"><label class="f" for="sqty" data-i="wQty"></label><input id="sqty" type="number" min="1" max="6" value="2"></div>
      <div class="fld"><label class="f" for="sask" data-i="sAsk"></label><input id="sask" type="number" min="0" step="10000"><p class="hint" id="sorig"></p></div>
    </div>
    <div class="fld"><label class="f" for="snote" data-i="sNote"></label><input id="snote" type="text" maxlength="80" data-ph="sNotePh"></div>
    <div class="fld"><label class="f" for="swhy" data-i="sWhy"></label><input id="swhy" type="text" maxlength="80" data-ph="sWhyPh"></div>
    <label class="chk"><input id="sconf" type="checkbox"><span data-i="sConf"></span></label>
    <p class="err" id="serr" hidden></p>
    <button class="btn" type="submit" data-i="sSubmit"></button>
    <p class="hint" data-i="sHint"></p>
  </form>
</section>

<section class="page" id="account">
  <h2 data-i="acT"></h2><p class="sub" data-i="acS"></p>
  <div class="panel" style="max-width:640px">
    <div class="prof"><div id="acav"></div>
      <div><button class="btn ghost" id="avbtn" type="button" data-i="avChange"></button> <button class="link" id="avrm" type="button" data-i="avRemove"></button>
      <input id="avfile" type="file" accept="image/*" hidden><p class="hint" data-i="avHint"></p></div></div>
    <form id="pform" novalidate>
      <div class="fld"><label class="f" for="pn" data-i="pName"></label><input id="pn" type="text"></div>
      <div class="row2">
        <div class="fld"><label class="f" for="pe">Email</label><input id="pe" type="email"></div>
        <div class="fld"><label class="f" for="pp" data-i="pPhone"></label><input id="pp" type="tel"></div>
      </div>
      <p class="err" id="perr" hidden></p>
      <button class="btn" type="submit" data-i="pSave"></button>
    </form>
  </div>
  <div class="sec"><h3 data-i="acWish"></h3><div id="acw"></div></div>
  <div class="sec"><h3 data-i="acRem"></h3><div id="acr"></div></div>
  <div class="sec"><h3 data-i="acMine"></h3><div id="acm"></div><a class="btn acc" href="#sell" data-i="postBtn" style="text-decoration:none"></a></div>
  <div class="sec"><button class="btn ghost" id="out2" data-i="logout"></button></div>
</section>
</main>

<footer><div class="foot">
  <div class="logo">Ticket<i>mate</i></div>
  <div><span data-i="supp"></span>: <a href="mailto:ticketmate@gmail.com">ticketmate@gmail.com</a></div>
</div></footer>

<div class="modal" id="m1" role="dialog" aria-modal="true"><div class="box"><h3 data-i="m1T"></h3><p data-i="m1P"></p><button class="btn" data-close data-i="close"></button></div></div>
<div class="modal" id="m2" role="dialog" aria-modal="true"><div class="box">
  <div id="m2form"><h3 data-i="m2T"></h3><p data-i="m2P"></p>
    <div class="fld"><input id="phone" type="tel" data-ph="phPh" aria-label="Phone"></div>
    <div style="display:flex;gap:8px"><button class="btn" id="send" data-i="send"></button><button class="btn ghost" data-close data-i="cancel"></button></div></div>
  <div id="m2ok" hidden><h3 data-i="m2oT"></h3><p data-i="m2oP"></p><button class="btn" data-close data-i="close"></button></div>
</div></div>
<div class="modal" id="m3" role="dialog" aria-modal="true"><div class="box">
  <div class="tabs" id="tabs"><button type="button" id="tl" class="on" data-i="login"></button><button type="button" id="tr" data-i="register"></button></div>
  <h3 id="ftitle" hidden data-i="forgotT"></h3>
  <form id="authf" novalidate>
    <div class="fld" id="nmw" hidden><label class="f" for="nm" data-i="name"></label><input id="nm" type="text" autocomplete="name"></div>
    <div class="fld"><label class="f" for="em" data-i="idLbl"></label><input id="em" type="text" autocomplete="username" data-ph="idPh"></div>
    <div class="fld" id="pww"><label class="f" for="pw" data-i="pw"></label>
      <div class="pw"><input id="pw" type="password" autocomplete="current-password" data-ph="pwPh"><button type="button" class="eye" id="eye" aria-pressed="false"></button></div>
      <div style="text-align:right;margin-top:6px" id="fgw"><button type="button" class="link" id="fg" data-i="forgot"></button></div></div>
    <p class="err" id="aerr" hidden></p>
    <p class="okmsg" id="rok" hidden style="margin:0 0 16px"></p>
    <div style="display:flex;gap:8px"><button class="btn" type="submit" id="asub"></button><button class="btn ghost" type="button" data-close data-i="cancel"></button></div>

function route(){
  const p=["home","wishlist","alert","resale","sell","account"].includes(location.hash.slice(1))?location.hash.slice(1):"home";
  if(p==="account"&&!state.user){location.hash="#home";requireLogin(()=>{location.hash="#account"});return}

}

const nextEvent=()=>EVENTS.filter(e=>e.sale>Date.now()).sort((a,b)=>a.sale-b.sale)[0]||null;

function renderHero(){
  const e=nextEvent(),box=$("#spot");heroId=e?e.id:null;
  if(!e){box.innerHTML=`<p>${t("none")}</p>`;return}
  const [d,h,m]=parts(e.sale),on=state.reminders.has(e.id);
  box.innerHTML=`<div class="spot-k">${t("spotK")}</div><div class="spot-name">${esc(e.name)}</div><p class="spot-m">${t("spotM")}${e.saleTxt}</p>

  <button class="btn ${on?"light":"acc"}" data-rem="${e.id}">${t(on?"remD":"rem")}</button>`;
}

  const e=nextEvent();if((e?e.id:null)!==heroId){renderHero();return}
  if(!e)return;const [d,h,m]=parts(e.sale);$("#hd").textContent=d;$("#hh").textContent=h;$("#hm").textContent=m;
}

  const btns=s==="soon"?`<button class="btn ghost ${r?"on":""}" data-rem="${e.id}">${t(r?"remD":"rem")}</button><button class="btn ghost ${w?"on":""}" data-wl="${e.id}">${t(w?"wlD":"wl")}</button>`
   :`<button class="btn ghost" data-rs="${e.id}">${t(s==="sold"?"findRs":"toRs")}</button><button class="btn ghost ${w?"on":""}" data-wl="${e.id}">${t(w?(s==="sold"?"watchD":"wlD"):(s==="sold"?"watch":"wl"))}</button>`;
  return `<article class="card ${s==="sold"?"go":""}" ${s==="sold"?`data-go="${e.id}"`:""}>

}

  e.preventDefault();
  requireLogin(()=>{
    state.saved={ev:$("#wev").value,tiers:$$("#wtiers input:checked").map(i=>i.value),qty:+$("#wqty").value,budget:+$("#wbud").value};
    state.wish.add(state.saved.ev);refreshHome();openModal("#m1");
  });
});

// ===== Alert =====
function renderSched(){
  $("#sched").innerHTML=[...EVENTS].sort((a,b)=>a.sale-b.sale).map(e=>{const s=statusOf(e);
  return `<tr><td>${e.saleTxt}</td><td>${esc(e.name)}</td><td><span class="tag ${s==="soon"?"":s}">${t("st_"+s)}</span></td></tr>`}).join("");
}
$("#aform").addEventListener("submit",e=>{e.preventDefault();$("#aok").hidden=false});

// ===== Resale: chỉ concert đã mở bán =====
const openEvents=()=>EVENTS.filter(e=>statusOf(e)!=="soon");
const openIds=()=>openEvents().map(e=>e.id);
$("#conlist").innerHTML=openEvents().map(e=>`<option value="${esc(e.name)}">`).join("");
$("#ftier").innerHTML+=[...new Set(openEvents().flatMap(e=>e.tiers.map(x=>x[0])))].map(x=>`<option>${x}</option>`).join("");
function matchesWishlist(l){const s=state.saved||DEMO_WISH;return s.ev===l.ev&&(!s.tiers.length||s.tiers.includes(l.tier))&&l.ask<=s.budget}
function renderListings(){
  const on=$("#fwish").getAttribute("aria-pressed")==="true",c=norm($("#fcon").value.trim()),tr=$("#ftier").value;
  const list=[...state.posted,...LISTINGS].filter(l=>openIds().includes(l.ev)&&(!on||matchesWishlist(l))&&(!c||norm(ev(l.ev).name+ev(l.ev).artist).includes(c))&&(!tr||tr===l.tier));
  $("#lempty").hidden=list.length>0;
  $("#listings").innerHTML=list.map(l=>{const e=ev(l.ev),s=statusOf(e),save=Math.round((1-l.ask/l.orig)*100),mine=!!(l.owner&&state.user&&l.owner===state.user.key);
  return `<article class="card"><div class="body">
  <div class="rowtop"><span class="meta">${t("lid")}${l.id}</span><span style="display:inline-flex;gap:6px;flex-wrap:wrap">${save>0?`<span class="tag">${t("good")} -${save}%</span>`:`<span class="tag v">${t("orig")}</span>`}${mine?`<span class="tag v">${t("mine")}</span>`:""}<span class="tag ${l.pend?"":"ver"}">${l.pend?t("pend"):"✔ "+t("ver")}</span></span></div>
  <h3>${esc(e.name)}</h3><p class="meta"><span class="tag ${s}">${t("st_"+s)}</span></p>
  <p class="meta"><span class="tag v">${l.tier}</span> ${esc(L(l.note))}</p>
  <div class="price"><s>${t("orig")} ${t("cur",l.orig)}${t("unit")}</s><b>${t("cur",l.ask)}${t("unit")}</b></div>
  <p class="meta">${t("why")}${esc(L(l.reason))}</p>
  <div class="actions">${mine?`<button class="btn ghost" data-del="${l.id}">${t("del")}</button>`:`<button class="btn" data-conn="${l.id}">${t("conn")}</button>`}</div></div></article>`}).join("");
}
$("#fwish").addEventListener("click",e=>{const b=e.currentTarget,on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);b.classList.toggle("on",on);renderListings()});
$("#fcon").addEventListener("input",renderListings);$("#ftier").addEventListener("change",renderListings);
$("#listings").addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(d){delListing(d.dataset.del);return}if(e.target.closest("[data-conn]"))requireLogin(()=>{$("#m2form").hidden=false;$("#m2ok").hidden=true;$("#phone").value="";openModal("#m2")})});
$("#send").addEventListener("click",()=>{
  if($("#phone").value.replace(/\D/g,"").length<9){toast(t("ePh"));$("#phone").focus();return}
  $("#m2form").hidden=true;$("#m2ok").hidden=false;
});
document.addEventListener("click",e=>{if(e.target.closest("[data-close]")||e.target.classList.contains("modal"))closeModals()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModals()});

// ===== Auth (demo: hồ sơ lưu trong trình duyệt, không lưu mật khẩu) =====
const EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>';
const isEmail=x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x),normPhone=x=>x.replace(/[\s.-]/g,"").replace(/^\+?84/,"0"),isPhone=x=>/^0\d{9}$/.test(normPhone(x));
const saveUser=()=>{store.set("tm_user",state.user);const us=store.get("tm_users")||{};us[state.user.key]=state.user;store.set("tm_users",us)};
function requireLogin(cb){if(state.user)return cb();pending=cb;setMode(mode==="forgot"?"login":mode);openModal("#m3")}
function setEye(show){$("#pw").type=show?"text":"password";$("#eye").innerHTML=show?EYEOFF:EYE;$("#eye").setAttribute("aria-pressed",show);$("#eye").setAttribute("aria-label",t(show?"hidePw":"showPw"))}
function setMode(m){
  mode=m;const reg=m==="register",fg=m==="forgot";
  $("#tabs").hidden=fg;$("#ftitle").hidden=!fg;$("#nmw").hidden=!reg;$("#pww").hidden=fg;$("#fgw").hidden=reg;$("#gw").hidden=fg;$("#back").hidden=!fg;
  $("#tl").classList.toggle("on",m==="login");$("#tr").classList.toggle("on",reg);
  $("#asub").textContent=t(fg?"forgotBtn":reg?"create":"login");
  $("#pw").autocomplete=reg?"new-password":"current-password";$("#aerr").hidden=true;$("#rok").hidden=true;setEye(false);
}
const avHtml=(u,c="")=>u.avatar?`<img class="av avimg ${c}" src="${u.avatar}" alt="">`:`<span class="av ${c}">${esc(u.name[0].toUpperCase())}</span>`;
function renderAuth(){
  const u=state.user;
  $("#auth").innerHTML=u?`<div class="user"><a href="#account" class="user" style="text-decoration:none" aria-label="${t("acT")}">${avHtml(u)}<span class="un">${esc(u.name)}</span></a><button class="btn ghost" id="out">${t("logout")}</button></div>`:`<button class="btn" id="inb">${t("login")}</button>`;
  if(u&&u.email&&!$("#mail").value)$("#mail").value=u.email;
}
function doLogout(){state.user=null;store.set("tm_user",null);renderAuth();renderListings();toast(t("bye"));if(location.hash==="#account")location.hash="#home"}
$("#auth").addEventListener("click",e=>{
  if(e.target.closest("#inb")){pending=null;setMode("login");openModal("#m3")}
  if(e.target.closest("#out"))doLogout();
});
$("#out2").addEventListener("click",doLogout);
$("#tl").addEventListener("click",()=>setMode("login"));$("#tr").addEventListener("click",()=>setMode("register"));
$("#fg").addEventListener("click",()=>setMode("forgot"));$("#back").addEventListener("click",()=>setMode("login"));
$("#eye").addEventListener("click",()=>setEye($("#pw").type==="password"));
function finishLogin(u){state.user=u;saveUser();const cb=pending;closeModals();renderAuth();renderListings();toast(t("hi")+u.name);$("#authf").reset();if(cb)cb()}
$("#authf").addEventListener("submit",e=>{
  e.preventDefault();
  const id=$("#em").value.trim(),pw=$("#pw").value,name=$("#nm").value.trim(),err=$("#aerr"),bad=k=>{err.hidden=false;err.textContent=t(k)};
  $("#rok").hidden=true;
  const em=isEmail(id.toLowerCase()),ph=!em&&isPhone(id);
  if(!em&&!ph)return bad("eId");
  const key=em?id.toLowerCase():normPhone(id);
  if(mode==="forgot"){err.hidden=true;$("#rok").hidden=false;$("#rok").textContent=t("forgotOk");return}
  if(pw.length<6)return bad("ePw");
  const users=store.get("tm_users")||{};let u;
  if(mode==="register"){
    if(!name)return bad("eName");
    if(users[key])return bad("eDup");
    u={key,name,email:em?key:"",phone:ph?key:"",avatar:""};
  }else u={...(users[key]||{name:em?key.split("@")[0]:key,email:em?key:"",phone:ph?key:"",avatar:""}),key};
  finishLogin(u);
});
$("#gbtn").addEventListener("click",()=>{
  const id=$("#em").value.trim().toLowerCase();
  if(!/^[^\s@]+@gmail\.com$/.test(id)){$("#aerr").hidden=false;$("#aerr").textContent=t("eGoogle");return}
  const users=store.get("tm_users")||{};
  finishLogin({...(users[id]||{name:id.split("@")[0],email:id,phone:"",avatar:""}),key:id});
});

// ===== Tài khoản =====
function renderAccount(){
  const u=state.user;if(!u)return;
  $("#acav").innerHTML=avHtml(u,"avl");$("#pn").value=u.name;$("#pe").value=u.email||"";$("#pp").value=u.phone||"";
  const none=`<p class="meta">${t("acNone")}</p>`;
  const list=set=>[...set].map(id=>{const e=ev(id),s=statusOf(e);return `<div class="li"><span>${esc(e.name)}</span><span class="tag ${s==="soon"?"":s}">${t("st_"+s)}</span></div>`}).join("")||none;
  $("#acw").innerHTML=list(state.wish);$("#acr").innerHTML=list(state.reminders);
  $("#acm").innerHTML=state.posted.filter(l=>l.owner===u.key).map(l=>`<div class="li"><span>#${l.id} · ${esc(ev(l.ev).name)} · ${l.tier} · ${t("cur",l.ask)}${t("unit")}</span><button class="btn ghost" data-del="${l.id}">${t("del")}</button></div>`).join("")||none;
}
$("#acm").addEventListener("click",e=>{const d=e.target.closest("[data-del]");if(d)delListing(d.dataset.del)});
$("#pform").addEventListener("submit",e=>{
  e.preventDefault();
  const n=$("#pn").value.trim(),em=$("#pe").value.trim().toLowerCase(),ph=$("#pp").value.trim(),err=$("#perr");
  const bad=k=>{err.hidden=false;err.textContent=t(k)};
  if(!n)return bad("eName");if(em&&!isEmail(em))return bad("eMail");if(ph&&!isPhone(ph))return bad("ePh");
  err.hidden=true;Object.assign(state.user,{name:n,email:em,phone:ph?normPhone(ph):""});saveUser();renderAuth();renderAccount();toast(t("pOk"));
});
$("#avbtn").addEventListener("click",()=>$("#avfile").click());
$("#avfile").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  if(!f.type.startsWith("image/"))return toast(t("avBad"));
  const r=new FileReader();
  r.onload=()=>{const img=new Image();
    img.onload=()=>{const S=256,c=document.createElement("canvas");c.width=c.height=S;const m=Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      state.user.avatar=c.toDataURL("image/jpeg",.85);saveUser();renderAuth();renderAccount();toast(t("avOk"))};
    img.onerror=()=>toast(t("avBad"));img.src=r.result};
  r.readAsDataURL(f);
});
$("#avrm").addEventListener("click",()=>{state.user.avatar="";saveUser();renderAuth();renderAccount()});

// ===== Người bán: đăng tin nhượng vé =====
function delListing(id){
  const l=state.posted.find(x=>x.id===id);if(!l||!state.user||l.owner!==state.user.key)return;
  state.posted=state.posted.filter(x=>x.id!==id);store.set("tm_posted",state.posted);renderListings();renderAccount();toast(t("delOk"));
}
$("#sev").innerHTML=openEvents().map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("");
const tierPrice=()=>ev($("#sev").value).tiers.find(x=>x[0]===$("#stier").value)[1];
function syncAsk(reset){const p=tierPrice();$("#sorig").textContent=t("sMax",t("cur",p));$("#sask").max=p;if(reset||!$("#sask").value)$("#sask").value=p}
function fillSTier(keep){
  const cur=$("#stier").value,e=ev($("#sev").value);
  $("#stier").innerHTML=e.tiers.map(([n,p])=>`<option value="${n}">${n} · ${t("cur",p)}</option>`).join("");
  const ok=keep&&e.tiers.some(x=>x[0]===cur);if(ok)$("#stier").value=cur;syncAsk(!ok);
}
$("#sev").addEventListener("change",()=>fillSTier(false));$("#stier").addEventListener("change",()=>syncAsk(true));
$("#sform").addEventListener("submit",e=>{
  e.preventDefault();
  const err=$("#serr"),bad=k=>{err.hidden=false;err.textContent=t(k)};
  const ask=+$("#sask").value,qty=+$("#sqty").value,p=tierPrice();
  if(!(qty>=1&&qty<=6))return bad("sErrQ");
  if(!(ask>0&&ask<=p))return bad("sErrP");
  if(!$("#sconf").checked)return bad("sErrC");
  requireLogin(()=>{
    const note=$("#snote").value.trim(),why=$("#swhy").value.trim(),evId=$("#sev").value;let id;
    do{id=String(9000+Math.floor(Math.random()*900))}while([...LISTINGS,...state.posted].some(x=>x.id===id));
    state.posted.unshift({id,ev:evId,tier:$("#stier").value,orig:p,ask,owner:state.user.key,pend:true,
      note:[T.vi.qtyN(qty)+(note?" · "+note:""),T.en.qtyN(qty)+(note?" · "+note:"")],reason:[why||"—",why||"—"]});
    store.set("tm_posted",state.posted);err.hidden=true;$("#sform").reset();fillSTier(false);toast(t("sOk"));goResale(evId);
  });
});

// ===== Language =====
function setLang(l){
  lang=l;store.set("tm_lang",l);document.documentElement.lang=l;
  $$("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $$("[data-ph]").forEach(el=>el.placeholder=t(el.dataset.ph));
  $$("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  renderTiers();renderCards();renderHero();renderSched();renderListings();renderAuth();setMode(mode);renderAccount();fillSTier(true);
}
$$("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

setLang(lang);route();
</script>
</body>
